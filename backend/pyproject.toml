[project]
name = "metron-backend"
version = "1.0.0"
description = "Metron Backend REST API — Offline-First Academic Command Center"
readme = "README.md"
authors = [
    { name = "PaulBrytonRaj18", email = "paulbrytonraj18@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.142.2",
    "google-genai>=2.27.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "supabase>=2.31.0",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore:.*testclient.*:DeprecationWarning",
    "ignore:.*starlette.*:Warning",
]

